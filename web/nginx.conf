map $request_method $payment_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $payment_limit_key zone=demo_payments:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"demo-web"}';
    }

    # Resolução em runtime acompanha IPs novos após recriar os microsserviços.
    location ~ "^/api/payment/(?<payment_path>health|payments(?:/[0-9a-fA-F-]{36})?)$" {
        limit_except GET POST { deny all; }
        limit_req zone=demo_payments burst=3 nodelay;
        limit_req_status 429;
        set $payment_upstream http://payment-service:3000;
        proxy_pass $payment_upstream/$payment_path$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_next_upstream off;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^/api/notification/(?<notification_path>health|notifications)$ {
        limit_except GET { deny all; }
        set $notification_upstream http://notification-service:3001;
        proxy_pass $notification_upstream/$notification_path$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_set_header Host $host;
    }

    location /api/ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
