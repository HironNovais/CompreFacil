# Acrescentar ao Compose da VPS; não modifica os microsserviços de negócio.
services:
  tunnel:
    image: cloudflare/cloudflared@sha256:b94b96edf2c9c4360f8879c8580cfaa99077f19c849ec595ca2f711b27d4f344
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://web:80
    depends_on:
      web: { condition: service_healthy }
    mem_limit: 96m
    cpus: 0.15
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped
